<div class="wl-practice-grid">
  {% for area in site.data.practice_areas %}
    <div class="wl-practice-card">
      <a href="{{ site.baseurl }}{{ area.url }}" class="wl-practice-card__link">
        <img src="{{ site.baseurl }}{{ area.icon }}" alt="" loading="lazy">
        <h3>{{ area.title }}</h3>
        <div class="wl-practice-card__text">{{ area.text }}</div>
        <span>Learn More <span aria-hidden="true">→</span></span>
      </a>
    </div>
  {% endfor %}
</div>
